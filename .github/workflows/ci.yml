name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 품질 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 단일 원천으로 사용
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm typecheck

      - name: 빌드
        run: pnpm build

  secret-scan:
    name: 시크릿 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # public 저장소라 키가 한 번이라도 커밋되면 유출
      - name: 키 패턴 검사
        run: |
          PATTERN='sk-ant-api[0-9]{2}-|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z0-9]'
          if git grep -nEI "$PATTERN" -- ':!.github/workflows/ci.yml' > /tmp/hits 2>/dev/null; then
            echo "시크릿으로 보이는 문자열을 찾았습니다."
            cat /tmp/hits
            exit 1
          fi
          echo "시크릿 패턴 없음"
